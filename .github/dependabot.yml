version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    groups:
      cargo:
        patterns: ["*"]

  # The npm package has no dependencies today, which is the point. This is what would
  # notice if one ever arrived.
  - package-ecosystem: npm
    directory: /packages/npm
    schedule:
      interval: weekly

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
