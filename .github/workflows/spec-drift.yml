name: Spec drift

# The schema in this repository must stay the same schema as the one served at the
# canonical URL, because documents in the wild point at that URL. "The same" is judged
# as JSON, not as bytes, so that a host which reformats what it serves (SchemaStore's
# Prettier reorders keys, for one) cannot register as drift while a changed value still
# does. Today the host is jsDelivr serving this repository at the release tag, so the two
# should be byte-identical as well; the looser comparison costs nothing and survives a
# move. This runs weekly rather than on every push, since it depends on a third party
# being reachable.
on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

# Fetches a public URL and compares it to a file in the checkout. Nothing else.
permissions:
  contents: read

jobs:
  compare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Fetch published schema
        id: fetch
        run: curl -sS --fail -m 30 "$CANONICAL_URL" -o /tmp/published.json
        env:
          # Must equal DEFAULT_SCHEMA_ID in crates/onyx-core/src/lib.rs, which a test
          # enforces: the URL documents carry is the URL this check watches.
          CANONICAL_URL: https://cdn.jsdelivr.net/gh/dsemakin/onyx@v1.0.0/spec/v1/log.schema.json
      - name: Compare as JSON
        # Both files are parsed and re-serialised with keys sorted at every level, so
        # formatting and key order cannot register as drift, and anything else does.
        run: |
          node -e '
            const fs = require("fs");
            const canon = (v) => Array.isArray(v) ? v.map(canon)
              : v && typeof v === "object"
                ? Object.fromEntries(Object.keys(v).sort().map((k) => [k, canon(v[k])]))
                : v;
            const read = (p) => JSON.stringify(canon(JSON.parse(fs.readFileSync(p, "utf8"))), null, 2);
            const ours = read("spec/v1/log.schema.json");
            const theirs = read("/tmp/published.json");
            if (ours !== theirs) {
              fs.writeFileSync("/tmp/ours.json", ours);
              fs.writeFileSync("/tmp/theirs.json", theirs);
              process.exit(1);
            }
            console.log("the published schema is the same JSON as spec/v1/log.schema.json");
          ' || { diff -u /tmp/ours.json /tmp/theirs.json; echo "::error::Published schema differs from spec/v1/log.schema.json"; exit 1; }
