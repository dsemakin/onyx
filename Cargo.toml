[workspace]
resolver = "3"
members = ["crates/onyx-core", "crates/onyx-cli", "crates/onyx-wasm"]
# Needs nightly and pulls in libfuzzer-sys, so it stays out of the workspace and out
# of what anyone installs. See fuzz/Cargo.toml.
exclude = ["fuzz"]

[workspace.package]
version = "1.0.0"
edition = "2024"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
repository = "https://github.com/dsemakin/onyx"
homepage = "https://github.com/dsemakin/onyx"
authors = ["Dan Semakin and the Onyx contributors"]
keywords = ["nutrition", "interchange", "health", "json-schema", "portability"]
categories = ["encoding", "data-structures"]

[workspace.dependencies]
onyx-core = { path = "crates/onyx-core", version = "1.0.0" }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"
